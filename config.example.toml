# agent-rs configuration
# Copy this file to .agent/config.toml and adjust as needed.

[provider]
type = "ollama"
base_url = "http://localhost:11434"
model = "code-agent-14b"

[agent]
max_iterations = 5
max_context_tokens = 12000
max_files_per_iteration = 12
max_file_size_kb = 200

[git]
auto_branch = true
branch_prefix = "agent/"

# MCP server configuration (optional)
